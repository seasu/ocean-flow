name: Build iOS / Android app

# 用 Capacitor 把網頁遊戲包成 App，全部在 GitHub Actions 建置與上架
# - 沒設 Secrets：Android 產出可直接安裝的測試版 APK；iOS 只在模擬器建置，確認能編譯
# - 設好 Secrets（見 docs/app.md）：Android 簽章 AAB 送 Google Play 內部測試；iOS 簽章送 TestFlight
on:
  push:
    branches: [main, 'claude/capacitor-app-**']
    paths: ['app/**', 'src/**', 'index.html', 'img/**', 'data/**', 'audio/**', 'video/**', 'icons/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      release:
        description: '送商店測試（Google Play 內部測試／TestFlight）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  OF_BUILD: ${{ github.run_number }}
  RELEASE: ${{ github.ref == 'refs/heads/main' || inputs.release }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web + native project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build
          node scripts/make-native.mjs android
      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "OF_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app/android
        env:
          OF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleDebug
          if [ "$HAS_KEY" = true ]; then ./gradlew --no-daemon bundleRelease; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ocean-flow-android-debug-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: ocean-flow-android-release-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/*.aab
      - name: Upload to Google Play (internal testing)
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true' && env.RELEASE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.seasu.oceanflow
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    runs-on: macos-15
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare web + native project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build
          node scripts/make-native.mjs ios
      - name: Build for simulator (no signing)
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      # 用 App Store Connect API 金鑰讓 Xcode 自動簽章（雲端管理憑證），不用自己管憑證和描述檔
      - name: Archive and upload to TestFlight
        if: env.HAS_ASC == 'true' && env.RELEASE == 'true'
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.ASC_KEY_P8 }}" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
