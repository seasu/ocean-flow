name: Fetch Taipei Travel data

# 這個環境連不到 travel.taipei，所以改在 GitHub Actions 抓資料後提交回同一個分支
on:
  push:
    branches: ['claude/**']
    paths: ['tools/fetch-taipei-travel.mjs', '.github/workflows/taipei-data.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fetch-taipei-travel.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update Taipei Travel attraction data and photos"
          git push
